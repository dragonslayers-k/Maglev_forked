apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'com.maglev.engine'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
    namespace "com.maglev.engine"
    compileSdkVersion safeExtGet("compileSdkVersion", 37)

    defaultConfig {
        minSdkVersion safeExtGet("minSdkVersion", 24)
        targetSdkVersion safeExtGet("targetSdkVersion", 36)
        versionCode 1
        versionName "0.1.0"
        consumerProguardFiles 'consumer-rules.pro'

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    lintOptions {
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation project(':expo-modules-core')
    // yt-dlp Android runtime. Its bundled FFmpeg AAR is excluded because its WebP payload is not 16 KB-page safe.
    implementation "io.github.junkfood02.youtubedl-android:library:0.18.1"
    // Maintained FFmpegKit fork: 16 KB page-aligned Android binaries; GPL variant matches this GPL-3.0 app.
    // Used for real post-download container conversion and audio extraction/re-encoding, not filename-only changes.
    implementation "dev.ffmpegkit-maintained:ffmpeg-kit-full-gpl:8.1.7"
    implementation "com.arthenica:smart-exception-java:0.2.1"
    // NewPipe is the fast YouTube format source; DASH tracks are joined by Maglev MediaMuxer.
    implementation "com.github.TeamNewPipe:NewPipeExtractor:v0.26.5"
    // YTDLnis-compatible WebView PO-token generation for NewPipe's adaptive YouTube formats.
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.google.code.gson:gson:2.13.2"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0"
    // Commons Compress uses Tukaani XZ for 7z/XZ archive codecs; explicit runtime dependency fixes R8 missing classes.
    implementation "org.tukaani:xz:1.10"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.23"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    implementation "androidx.core:core-ktx:1.17.0"
    implementation "androidx.documentfile:documentfile:1.0.1"
    // Browser view: pull to reload (24.10a). https://developer.android.com/jetpack/androidx/releases/swiperefreshlayout
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    // Browser view: algorithmic darkening (24.10a). https://developer.android.com/jetpack/androidx/releases/webkit
    implementation "androidx.webkit:webkit:1.14.0"
    // 2.12.0 (2026-09-23) is current stable. CoroutineWorker lives in work-runtime since 2.9; -ktx is an empty alias.
    // https://developer.android.com/jetpack/androidx/releases/work
    implementation "androidx.work:work-runtime-ktx:2.12.0"

    // JVM unit tests: android.jar stubs org.json and org.xmlpull, so real implementations go on the test classpath.
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
    testImplementation "xmlpull:xmlpull:1.1.3.1"
    testImplementation "net.sf.kxml:kxml2:2.3.0"
}
